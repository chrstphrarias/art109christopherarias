<!DOCTYPE html>
<html lang="en">

<head>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>true</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: rgb(255, 255, 255);
            animation: epilepsy 0.5s linear infinite;
            position: relative;
        }

        img {
            width: 20vw;
            height: 20vh;
            position: absolute;
        }

        @keyframes epilepsy {

            0%,
            100% {
                filter: hue-rotate(0deg);
            }

            50% {
                filter: hue-rotate(360deg);
            }
        }
    </style>
</head>


<body>

    <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Fi.imgflip.com%2F5pb6e5.png&f=1&nofb=1&ipt=c4151edce7c95d47d87bfe1493fa95559ae8f455c294dd9398f068f9b0c82a56"
        alt="Obama Prism">

        <a href="subfolder/subsimple.html">Link to Page 1</a>
        <a href="simple.html">Link to Page 2</a>
            
    <script>
        const img = document.querySelector('img');
        const body = document.body;

        let x = 0;
        let xDirection = 0.1;

        function bounceX() {
            if (x >= 80) {
                xDirection = -0.1;
            } else if (x <= 0) {
                xDirection = 0.1;
            }
            x += xDirection;
            img.style.left = `${x}vw`;
        }

        let y = 0;
        let yDirection = 0.1;

        function bounceY() {
            if (y >= 80) {
                yDirection = -0.1;
            } else if (y <= 0) {
                yDirection = 0.1;
            }
            y += yDirection;
            img.style.top = `${y}vh`;
        }

        setInterval(bounceX, 10);
        setInterval(bounceY, 6);
    </script>

</body>

</html>
