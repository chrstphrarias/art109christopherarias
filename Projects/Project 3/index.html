<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050816">
    <title>Enter the Brainscereal Experience</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="entrance-page">
    <main class="entrance">
        <p class="eyebrow" draggable="true">A very serious internet experience</p>
        <h1 draggable="true">Are you ready?</h1>
        <button class="start-experience" type="button" aria-describedby="entrance-note" draggable="true">
            Begin Official
            <img src="media/mind-blown-shark.gif" alt="">
        </button>
        <p id="entrance-note" class="entrance-note" draggable="true">hi</p>
        <p class="flashing-warning" draggable="true">hello</p>
    </main>

    <div class="hyperspace-transition" aria-hidden="true">
        <img class="hyperspace-animation" src="media/hyperspace.gif" alt="">
        <img class="robin-speed" src="media/robinspeed.gif" alt="">
        <p class="warp-message" draggable="true">Entering the experience...</p>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
